server {
    listen 80;
    listen [::]:80;
    server_name idis-welfare.co.kr www.idis-welfare.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name idis-welfare.co.kr www.idis-welfare.co.kr;

    ssl_certificate     /etc/letsencrypt/live/idis-welfare.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idis-welfare.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    access_log /var/log/nginx/idis.access.log;
    error_log  /var/log/nginx/idis.error.log;
}