# 환경과 무관한 공통 설정.
# DB 접속 정보와 업로드 경로처럼 환경마다 다른 값은 프로파일 파일에서 정한다.
#   로컬  : application-local.properties (git 에 올리지 않음, .example 참고)
#   운영  : application-prod.properties + 환경변수
spring.application.name=idis

# 프로파일을 안 주면 로컬로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=prod 로 띄운다.
spring.profiles.active=local

# 선택지 이미지 저장 위치. 운영은 환경변수로 덮어쓴다.
app.upload.dir=${UPLOAD_DIR:./uploads}

# 이미지 5MB 제한은 코드에서 따로 보므로 여기는 여유를 둔다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# 사내에서만 쓰고 자주 드나드는 화면이라 세션을 길게 잡는다.
server.servlet.session.timeout=30d
