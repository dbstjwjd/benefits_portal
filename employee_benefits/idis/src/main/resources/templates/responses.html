<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>신청내역 | IDIS</title>
    <link rel="icon" type="image/png" sizes="32x32"
        th:href="@{/image/favicon-32.png}" href="/image/favicon-32.png">
    <link rel="icon" type="image/png"
        th:href="@{/image/favicon.png}" href="/image/favicon.png">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}" href="/css/forms.css">
</head>

<body class="app">
    <header class="app-header">
        <h1>신청내역</h1>
        <a class="home-link" th:href="@{/forms}" href="/forms" aria-label="홈">
            <img th:src="@{/image/icon-home.svg}" src="/image/icon-home.svg" alt="">
        </a>
    </header>

    <div class="chips" th:if="${!responses.isEmpty()}">
        <button class="chip is-active" type="button" data-filter="all">전체</button>
        <button class="chip" type="button" data-filter="open">진행중</button>
        <button class="chip" type="button" data-filter="closed">완료</button>
    </div>

    <ul class="history-list" th:if="${!responses.isEmpty()}" id="historyList">
        <li th:each="response : ${responses}"
            th:attr="data-state=${response.formOpen} ? 'open' : 'closed'">
            <a class="history-card" th:href="@{/forms/{id}(id=${response.formId})}" href="#">
                <span class="row">
                    <span class="name" th:text="${response.formTitle}">2026 하반기 복리후생 신청</span>
                    <span class="badge" th:classappend="${response.formOpen} ? 'is-open' : 'is-closed'"
                        th:text="${response.formOpen} ? '제출완료' : '완료'">제출완료</span>
                </span>
                <span class="rule"></span>
                <span class="row">
                    <span class="summary" th:text="'신청 항목: ' + ${response.summary}">신청 항목: 한우 세트</span>
                    <span class="date"
                        th:text="${#temporals.format(response.submittedAt, 'yyyy.MM.dd')}">2026.08.20</span>
                </span>
            </a>
        </li>
    </ul>

    <div class="empty-state" th:if="${responses.isEmpty()}">
        <img class="mascot" th:src="@{/image/robot-empty.png}" src="/image/robot-empty.png" alt="">
        <div class="texts">
            <h2>아직 신청한 내역이 없어요</h2>
            <p>새로운 설문에 참여하고 복리후생을 신청해보세요</p>
        </div>
        <a class="btn-primary" th:href="@{/forms}" href="/forms">신청하러 가기</a>
    </div>

    <div th:if="${!responses.isEmpty()}" style="flex: 1;"></div>

    <script>
        const chips = document.querySelectorAll(".chip");
        const items = document.querySelectorAll("#historyList > li");

        chips.forEach((chip) => {
            chip.addEventListener("click", () => {
                chips.forEach((c) => c.classList.toggle("is-active", c === chip));
                const filter = chip.dataset.filter;
                items.forEach((item) => {
                    const show = filter === "all" || item.dataset.state === filter;
                    item.style.display = show ? "" : "none";
                });
            });
        });
    </script>
</body>

</html>
