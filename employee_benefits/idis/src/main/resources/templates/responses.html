<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>신청 내역 | IDIS</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}" href="/css/forms.css">
</head>

<body class="app">
    <div class="head">
        <header class="top">
            <a class="back" th:href="@{/forms}" href="/forms">← 목록</a>
            <form th:action="@{/logout}" action="/logout" method="post">
                <button class="logout-btn" type="submit">로그아웃</button>
            </form>
        </header>
        <div class="head-title">
            <p class="greeting">
                <strong th:text="${loginUser.name}">홍길동</strong>님, 안녕하세요
            </p>
            <h1 class="title">신청 내역</h1>
        </div>
    </div>

    <main class="page">
        <ul class="cards" th:if="${!responses.isEmpty()}">
            <li class="card" th:each="response : ${responses}">
                <a class="card-link" th:href="@{/forms/{id}(id=${response.formId})}" href="#">
                    <span class="badge" th:classappend="${response.formOpen} ? 'done' : 'closed'"
                        th:text="${response.formOpen} ? '진행중' : '마감'">진행중</span>
                    <h2 class="card-title" th:text="${response.formTitle}">2026년 추석 선물 신청</h2>
                    <p class="card-period">
                        <span th:text="${#temporals.format(response.submittedAt, 'yyyy.MM.dd')} + ' 신청'">신청일</span>
                        <span th:if="${response.edited}"> · 수정됨</span>
                    </p>
                </a>
            </li>
        </ul>

        <div class="empty" th:if="${responses.isEmpty()}">
            <div class="char-wrap">
                <img class="char" th:src="@{/image/robot.png}" src="/image/robot.png" alt="">
            </div>
            <p>아직 신청한 복리후생이 없습니다</p>
        </div>
    </main>
</body>

</html>
