<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>복리후생 신청 | IDIS</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}" href="/css/forms.css">
</head>

<body class="app">
    <div class="head">
        <header class="top">
            <img class="logo" th:src="@{/image/idis_logo.png}" src="/image/idis_logo.png" alt="IDIS">
            <div class="top-actions">
                <a class="nav-link" th:href="@{/responses}" href="/responses">신청 내역</a>
                <form th:action="@{/logout}" action="/logout" method="post">
                    <button class="logout-btn" type="submit">로그아웃</button>
                </form>
            </div>
        </header>
        <div class="head-title">
            <p class="greeting">
                <strong th:text="${loginUser.name}">홍길동</strong>님, 안녕하세요
            </p>
            <h1 class="title">신청 가능한 복리후생</h1>
        </div>
    </div>

    <main class="page">
        <ul class="cards" th:if="${!forms.isEmpty()}">
            <li class="card" th:each="form : ${forms}">
                <a class="card-link" th:href="@{/forms/{id}(id=${form.id})}" href="#">
                    <span class="badge done" th:if="${submittedFormIds.contains(form.id)}">신청 완료</span>
                    <h2 class="card-title" th:text="${form.title}">2026년 추석 선물 신청</h2>
                    <p class="card-desc" th:text="${form.description}">설명</p>
                    <p class="card-period" th:if="${form.endAt != null}"
                        th:text="'~ ' + ${#temporals.format(form.endAt, 'yyyy.MM.dd')} + ' 마감'">~ 마감</p>
                </a>
            </li>
        </ul>

        <div class="empty" th:if="${forms.isEmpty()}">
            <div class="char-wrap">
                <img class="char" th:src="@{/image/robot.png}" src="/image/robot.png" alt="">
            </div>
            <p>현재 신청할 수 있는 복리후생이 없습니다</p>
        </div>
    </main>
</body>

</html>
