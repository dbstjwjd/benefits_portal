<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IDIS 직원 복리후생 시스템</title>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/image/favicon-32.png}" href="/image/favicon-32.png">
    <link rel="icon" type="image/png" th:href="@{/image/favicon.png}" href="/image/favicon.png">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>

<body class="app">
    <div class="login-shell">
        <main class="login-content">
            <div class="brand">
                <img class="logo" th:src="@{/image/idis_logo.png}" src="/image/idis_logo.png" alt="IDIS">
                <div>
                    <h1 class="title">직원 복리후생 시스템</h1>
                    <p class="desc" th:text="${loginNotice}">복리후생 신청은 이곳에서 진행합니다</p>
                </div>
            </div>

            <p class="alert" th:if="${param.error}">이름 또는 전화번호가 일치하지 않습니다</p>
            <p class="alert" th:if="${param.nopin}">관리자에게 PIN 발급을 요청해 주세요</p>

            <form id="loginForm" th:action="@{/login}" action="/login" method="post" novalidate>
                <!-- 시안처럼 카드 위로 빼꼼 나오게 카드 기준으로 붙인다 -->
                <img class="domi-peek" th:src="@{/image/domi-peek.png}" src="/image/domi-peek.png" alt="">
                <div class="login-card">
                    <div class="field" id="nameField">
                        <label for="name">이름 <span class="req">*</span></label>
                        <div class="input-box">
                            <input id="name" name="name" type="text" placeholder="이름을 입력해주세요" autocomplete="name">
                        </div>
                        <p class="msg" id="nameMsg"></p>
                    </div>
                    <div class="field" id="phoneField">
                        <label for="phone">전화번호 <span class="req">*</span></label>
                        <div class="input-box">
                            <img class="input-icon" th:src="@{/image/icon-phone.svg}" src="/image/icon-phone.svg"
                                alt="">
                            <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="010-0000-0000"
                                autocomplete="tel" maxlength="13">
                        </div>
                        <p class="msg" id="phoneMsg"></p>
                    </div>
                </div>

                <div class="actions" style="margin-top: 24px;">
                    <button class="btn-primary" type="submit">로그인</button>

                    <div class="divider" aria-hidden="true">
                        <span class="line"></span>
                        <span class="or">또는</span>
                        <span class="line"></span>
                    </div>

                    <button class="btn-outline" type="button" id="contactBtn">
                        <img th:src="@{/image/icon-message.svg}" src="/image/icon-message.svg" alt="">
                        관리자 문의 안내
                    </button>
                </div>
            </form>
        </main>
    </div>

    <dialog class="contact" id="contactModal">
        <h2 th:text="${contactTitle}">사이트 이용 문의</h2>
        <p class="contact-intro" th:if="${!#strings.isEmpty(contactIntro)}" th:text="${contactIntro}">
            로그인이 안 되거나 사이트 이용에 문제가 있으면 아래 담당자에게 방문 또는 내선으로 문의해 주세요.
        </p>

        <ul class="contact-list" th:if="${!contactPersons.isEmpty()}">
            <li class="contact-card" th:each="person : ${contactPersons}">
                <p class="who">
                    <span class="name" th:text="${person.name()}">담당자</span>
                    <span class="role" th:if="${!#strings.isEmpty(person.role())}" th:text="${person.role()}">역할</span>
                </p>
                <dl class="detail">
                    <div th:if="${!#strings.isEmpty(person.location())}">
                        <dt>위치</dt>
                        <dd th:text="${person.location()}">위치</dd>
                    </div>
                    <div th:if="${!#strings.isEmpty(person.extension())}">
                        <dt>내선</dt>
                        <dd th:text="${person.extension()}">내선</dd>
                    </div>
                </dl>
            </li>
        </ul>

        <p class="contact-footnote" th:if="${!#strings.isEmpty(contactFootnote)}" th:text="${contactFootnote}">
            복지 항목 관련 문의는 인사팀 또는 총무팀에 문의해 주세요.
        </p>

        <button class="btn-primary" type="button" id="contactClose">닫기</button>
    </dialog>

    <script>
        const form = document.getElementById("loginForm");
        const nameInput = document.getElementById("name");
        const phoneInput = document.getElementById("phone");

        function setError(fieldId, msgId, message) {
            document.getElementById(fieldId).classList.add("err");
            document.getElementById(msgId).textContent = message;
        }

        function clearError(fieldId) {
            document.getElementById(fieldId).classList.remove("err");
        }

        phoneInput.addEventListener("input", () => {
            const digits = phoneInput.value.replace(/\D/g, "").slice(0, 11);
            let formatted = digits;
            if (digits.length > 7) formatted = `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
            else if (digits.length > 3) formatted = `${digits.slice(0, 3)}-${digits.slice(3)}`;
            phoneInput.value = formatted;
        });

        nameInput.addEventListener("input", () => clearError("nameField"));
        phoneInput.addEventListener("input", () => clearError("phoneField"));

        form.addEventListener("submit", (e) => {
            let valid = true;

            if (!nameInput.value.trim()) {
                setError("nameField", "nameMsg", "이름을 입력하세요");
                valid = false;
            }

            const digits = phoneInput.value.replace(/\D/g, "");
            if (!digits) {
                setError("phoneField", "phoneMsg", "전화번호를 입력하세요");
                valid = false;
            } else if (!/^01[016789]\d{7,8}$/.test(digits)) {
                setError("phoneField", "phoneMsg", "전화번호 형식이 올바르지 않습니다");
                valid = false;
            }

            if (!valid) e.preventDefault();
        });

        const contactModal = document.getElementById("contactModal");
        document.getElementById("contactBtn").addEventListener("click", () => contactModal.showModal());
        document.getElementById("contactClose").addEventListener("click", () => contactModal.close());
        contactModal.addEventListener("click", (e) => {
            if (e.target === contactModal) contactModal.close();
        });
    </script>
</body>

</html>
