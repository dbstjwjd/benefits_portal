# 운영 설정. 값이 있는 것만 여기 두고, 비밀은 전부 환경변수로 받는다.
# 필요한 환경변수: DB_URL, DB_USERNAME, DB_PASSWORD, UPLOAD_DIR
# (systemd 유닛 deploy/idis.service 에서 넣어 준다)

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 운영에서는 스키마를 코드가 바꾸지 않는다. 맞지 않으면 뜨지 않고 바로 알려준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 템플릿·정적 파일 캐시 (기본값이지만 명시해 둔다)
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=7d
# CSS/JS 주소에 내용 해시를 붙인다. 파일이 바뀌면 주소가 바뀌므로
# 7일 캐시에 걸린 브라우저도 배포 직후 새 파일을 받는다.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# 오류 화면에서 스택트레이스가 새어 나가지 않게 한다
server.error.include-stacktrace=never
server.error.include-message=never

# Nginx 뒤에 있으므로 X-Forwarded-* 를 신뢰해 https 로 인식하게 한다
server.forward-headers-strategy=native

# 로그 레벨은 logback-spring.xml 이 정한다. 여기서 겹쳐 두지 않는다.
logging.file.path=${LOG_DIR:/var/log/idis}
